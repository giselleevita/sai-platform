services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sai_password}
      POSTGRES_DB: ${POSTGRES_DB:-sai_db}
    volumes:
      - sai_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://sai_user:sai_password@postgres:5432/sai_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # The API refuses to start in production without a real value here.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before deploying}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # All three are build-time: Next bakes rewrite destinations and
        # NEXT_PUBLIC_* values into the build. Changing them needs a rebuild.
        API_ORIGIN: ${API_ORIGIN:-http://api:3001}
        NEXT_PUBLIC_DEMO_EMAIL: ${NEXT_PUBLIC_DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${NEXT_PUBLIC_DEMO_PASSWORD:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Kept for parity with the build argument. The value that takes effect
      # is the one passed at build time.
      API_ORIGIN: ${API_ORIGIN:-http://api:3001}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  sai_postgres_data:
