version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
